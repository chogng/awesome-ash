name: Release sanity

on:
  workflow_call:
    inputs:
      product:
        type: string
        required: true
      version:
        type: string
        required: true
      source:
        type: string
        default: release
  workflow_dispatch:
    inputs:
      product:
        type: choice
        options: [all, ash-code, ash-app-server]
        default: all
        required: true
      version:
        description: Released version or v-prefixed release tag
        type: string
        required: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.21.0"
      - id: matrix
        env:
          PRODUCT: ${{ inputs.product }}
        run: echo "matrix=$(node build/release/sanity.mjs matrix --product "$PRODUCT")" >> "$GITHUB_OUTPUT"

  verify:
    needs: plan
    name: ${{ matrix.product }} / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      ASH_UPDATE_PUBLIC_KEY: ${{ vars.ASH_UPDATE_PUBLIC_KEY }}
      PYTHON: ${{ matrix.platform == 'win32' && 'python' || 'python3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.21.0"
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Locate Windows signature verifier
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\${{ matrix.arch }}\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
          if (-not $tool) { throw 'SignTool is required for release sanity' }
          $tool.DirectoryName >> $env:GITHUB_PATH
      - name: Download staged pipeline packages
        if: inputs.source == 'pipeline'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-packages-${{ matrix.target }}
          path: .build/release-artifacts
      - name: Verify delivered release
        env:
          PRODUCT: ${{ matrix.product }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
          SOURCE: ${{ inputs.source || 'release' }}
        run: |
          args=(verify --product "$PRODUCT" --version "${VERSION#v}" --target "$TARGET" --output ".build/release-sanity/$PRODUCT/$TARGET")
          case "$SOURCE" in
            pipeline) args+=(--artifacts-dir .build/release-artifacts) ;;
            release) ;;
            *) echo "Unsupported artifact source: $SOURCE" >&2; exit 1 ;;
          esac
          node build/release/sanity.mjs "${args[@]}"
      - name: Upload report and failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-sanity-${{ matrix.product }}-${{ matrix.target }}
          path: .build/release-sanity/${{ matrix.product }}/${{ matrix.target }}/
          if-no-files-found: error
